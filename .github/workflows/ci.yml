name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test-and-build:
    name: Test & Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run automated unit tests
        run: npm test

      - name: Build frontend application
        run: npm run build

      - name: Test Sentinel CLI engine
        run: |
          node cli/sentinel.js --scenario cart --threshold 40

